name: Container

on:
  workflow_call:
  push:
    paths:
      - Dockerfile
      - Dockerfile.release
      - compose.yaml
      - deploy/**
      - package.json
      - package-lock.json
      - server/**
      - shared/**
      - src/**
      - public/**
      - scripts/**
      - .github/actions/validate-container/**
      - .github/workflows/container.yml
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.release
      - compose.yaml
      - deploy/**
      - package.json
      - package-lock.json
      - server/**
      - shared/**
      - src/**
      - public/**
      - scripts/**
      - .github/actions/validate-container/**
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/validate-container

  validate-release-runtime:
    name: Validate release runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm run build
      - run: DOCKERFILE=Dockerfile.release bash scripts/container-smoke.sh

  validate-postgres-compose-runtime:
    name: Validate optional PostgreSQL Compose runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm run build
      - run: npm run test:container-postgres-smoke
