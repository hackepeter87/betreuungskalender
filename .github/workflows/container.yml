name: Container

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.release
      - compose.yaml
      - deploy/**
      - package.json
      - package-lock.json
      - index.html
      - tsconfig*.json
      - vite.config.*
      - server/**
      - shared/**
      - src/**
      - public/**
      - scripts/**
      - .github/actions/validate-container/**
      - .github/workflows/container.yml
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.release
      - compose.yaml
      - deploy/**
      - package.json
      - package-lock.json
      - index.html
      - tsconfig*.json
      - vite.config.*
      - server/**
      - shared/**
      - src/**
      - public/**
      - scripts/**
      - .github/actions/validate-container/**
      - .github/workflows/container.yml

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate container inputs
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.scope.outputs.image }}
      postgres_container: ${{ steps.scope.outputs.postgres_container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs
      - uses: ./.github/actions/validate-container

  validate-release-runtime:
    name: Validate release runtime image
    needs: validate
    if: needs.validate.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm run build
      - run: DOCKERFILE=Dockerfile.release bash scripts/container-smoke.sh

  validate-postgres-compose-runtime:
    name: Validate optional PostgreSQL Compose runtime
    needs: validate
    if: needs.validate.outputs.postgres_container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm run build
      - run: npm run test:container-postgres-smoke
