version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 6
    groups:
      routine-production:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@fastify/*"
          - better-sqlite3
          - fastify
          - ical.js
          - jspdf
          - kysely
          - nodemailer
          - openid-client
          - pg
          - rrule
          - zod
      routine-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    groups:
      workflow-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      container-bases:
        patterns:
          - "*"
