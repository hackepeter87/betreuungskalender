name: Publish release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.2.1
        required: true
        type: string
      upload_digest_to_release:
        description: Upload the image digest file to the matching GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HARBOR_REGISTRY: harbor.mgmt.huneck.org
  HARBOR_IMAGE_NAME: applications/betreuungskalender
  HARBOR_CHART_REPOSITORY: charts

jobs:
  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Resolve release tag and image tags
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_UPLOAD_DIGEST: ${{ inputs.upload_digest_to_release || false }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          HARBOR_REGISTRY: ${{ env.HARBOR_REGISTRY }}
          HARBOR_IMAGE_NAME: ${{ env.HARBOR_IMAGE_NAME }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            upload_digest="$INPUT_UPLOAD_DIGEST"
          else
            tag="$RELEASE_TAG"
            upload_digest="true"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be SemVer with a leading v, got '$tag'."
            exit 1
          fi

          image="${REGISTRY}/${IMAGE_NAME,,}"
          harbor_image="${HARBOR_REGISTRY}/${HARBOR_IMAGE_NAME}"
          version="${tag#v}"
          tags="$(
            printf '%s\n' \
              "${image}:${tag}" \
              "${image}:${version}" \
              "${harbor_image}:${tag}" \
              "${harbor_image}:${version}"
          )"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "image=$image"
            echo "harbor_image=$harbor_image"
            echo "upload_digest=$upload_digest"
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Resolve checked-out commit
        id: git
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm install --global npm@11.18.0

      - run: npm ci

      - name: Strict release validation
        run: npm run release:check:strict

      - name: Validate release runtime image
        run: DOCKERFILE=Dockerfile.release bash scripts/container-smoke.sh

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Harbor for image publication
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.git.outputs.commit }}
            org.opencontainers.image.title=betreuungskalender
            org.opencontainers.image.description=Betreuungskalender release runtime image

      - name: Publish OCI Helm chart to Harbor
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | helm registry login \
            "$HARBOR_REGISTRY" \
            --username "$HARBOR_USERNAME" \
            --password-stdin
          mkdir -p .release-charts
          helm package charts/betreuungskalender \
            --destination .release-charts \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.version }}"
          helm push \
            ".release-charts/betreuungskalender-${{ steps.release.outputs.version }}.tgz" \
            "oci://${HARBOR_REGISTRY}/${HARBOR_CHART_REPOSITORY}"

      - name: Write image digest
        shell: bash
        run: |
          digest_file="betreuungskalender-${{ steps.release.outputs.tag }}.image-digest.txt"
          {
            echo "GHCR image: ${{ steps.release.outputs.image }}"
            echo "Harbor image: ${{ steps.release.outputs.harbor_image }}"
            echo "Digest: ${{ steps.build.outputs.digest }}"
            echo "Immutable reference: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo
            echo "Tags:"
            printf '%s\n' "${{ steps.release.outputs.tags }}"
          } > "$digest_file"

          {
            echo "## Release images"
            echo
            echo "- GHCR image: \`${{ steps.release.outputs.image }}\`"
            echo "- Harbor image: \`${{ steps.release.outputs.harbor_image }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- GHCR immutable reference: \`${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}\`"
            echo "- Harbor immutable reference: \`${{ steps.release.outputs.harbor_image }}@${{ steps.build.outputs.digest }}\`"
            echo "- Harbor OCI chart: \`oci://${HARBOR_REGISTRY}/${HARBOR_CHART_REPOSITORY}/betreuungskalender:${{ steps.release.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: betreuungskalender-${{ steps.release.outputs.tag }}-image-digest
          path: betreuungskalender-${{ steps.release.outputs.tag }}.image-digest.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload image digest to release
        if: ${{ steps.release.outputs.upload_digest == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "betreuungskalender-${{ steps.release.outputs.tag }}.image-digest.txt" \
            --clobber
